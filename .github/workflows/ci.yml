name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  logic:
    name: Logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK 4 bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0

      - name: Byte-compile the package
        run: python3 -m compileall -q aura_launcher

      - name: Run logic tests
        run: python3 tools/test_logic.py

  gui:
    name: GUI smoke test (Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK 4 and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 xvfb

      - name: Build the window headlessly
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" python3 tools/smoke_test.py

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check install scripts
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n aura-launcher

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0

      - name: Install / uninstall round trip
        run: |
          export PREFIX="$RUNNER_TEMP/prefix"
          ./install.sh
          test -x "$PREFIX/bin/aura-launcher"
          test -f "$PREFIX/share/applications/org.aura.Launcher.desktop"
          test -f "$PREFIX/share/icons/hicolor/scalable/apps/org.aura.Launcher.svg"

          ./uninstall.sh
          test ! -e "$PREFIX/bin/aura-launcher"
          test ! -e "$PREFIX/share/aura-launcher"
          test ! -e "$PREFIX/share/icons/hicolor/scalable/apps/org.aura.Launcher.svg"

          # A stale cache keeps listing a removed icon and hides the system one.
          if [ -f "$PREFIX/share/icons/hicolor/icon-theme.cache" ]; then
            if grep -q "org.aura.Launcher" "$PREFIX/share/icons/hicolor/icon-theme.cache"; then
              echo "stale icon cache entry left behind" >&2
              exit 1
            fi
          fi

  packages:
    name: Packages (.deb / .rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm lintian

      - name: Build .deb
        run: ./packaging/build-deb.sh

      - name: Lint the .deb
        run: lintian --tag-display-limit 0 build/*.deb

      - name: Build .rpm
        run: ./packaging/build-rpm.sh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            build/*.deb
            build/*.rpm
